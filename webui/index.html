<!DOCTYPE html>
<html>
<head>
  <title>VerityOS Console</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      padding: 20px;
      line-height: 1.6;
    }
    h3 {
      margin-bottom: 15px;
    }
    #input {
      width: 60%;
      padding: 8px;
      font-size: 1em;
      margin-right: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h3>🧠 VerityOS — Agent Console</h3>
  <input type="text" id="input" placeholder="Enter .help, .note, .vault, etc." />
  <button onclick="send()">Send</button>

  <pre id="output">⏳ Initializing VerityOS...</pre>

  <script>
    document.getElementById('input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        send();
      }
    });

    async function send() {
      const input = document.getElementById('input').value.trim();
      document.getElementById('input').value = "";
      const output = document.getElementById('output');
      if (!input) {
        output.textContent += "\n\n⚠️ Please enter a command.";
        output.scrollTop = output.scrollHeight;
        return;
      }

      output.textContent += "\n\n⏳ Processing command...";
      output.scrollTop = output.scrollHeight;

      try {
        const res = await fetch('/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: input })
        });

        if (!res.ok) {
          const text = await res.text();
          output.textContent += `\n\n❌ Error: ${text}`;
        } else {
          const text = await res.text();
          output.textContent += `\n\n${text || "✅ Done (no output returned)"}`;
        }
        output.scrollTop = output.scrollHeight;

      } catch (err) {
        output.textContent += `\n\n🚨 Network error: ${err}`;
        output.scrollTop = output.scrollHeight;
      }
    }

    window.onload = async function () {
      const output = document.getElementById('output');
      output.textContent = "🔄 Starting VerityOS...\n\n";

      try {
        const res = await fetch('/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: '.intro' })
        });
        const text = await res.text();
        output.textContent += `${text}`;
        output.scrollTop = output.scrollHeight;
      } catch (err) {
        output.textContent += `\n\n⚠️ Failed to load VerityOS intro: ${err}`;
        output.scrollTop = output.scrollHeight;
      }
    };
  </script>
  <footer>
    🔹 Creator: sKools  🌐 Reference: <a href="https://verityos.net" target="_blank" style="color:#66d9ef;">verityos.net</a> | 
    <a href="https://beta.verityos.net" target="_blank" style="color:#66d9ef;">beta.verityos.net</a>
  </footer>
</body>
</html>
